name: Bot Actions

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: '0 0 * * *'  # Daily cleanup

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Auto-label PRs based on changed files
  auto-label:
    name: Auto Label
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml

  # Handle bot commands in comments
  bot-commands:
    name: Bot Commands
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/bot')
    steps:
      - uses: actions/checkout@v4
      
      - name: Parse command
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          if [[ "$COMMENT" =~ /bot[[:space:]]+run[[:space:]]+tests ]]; then
            echo "command=run-tests" >> $GITHUB_OUTPUT
          elif [[ "$COMMENT" =~ /bot[[:space:]]+merge ]]; then
            echo "command=merge" >> $GITHUB_OUTPUT
          elif [[ "$COMMENT" =~ /bot[[:space:]]+label[[:space:]]+(.+) ]]; then
            echo "command=label" >> $GITHUB_OUTPUT
            echo "label=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          fi
      
      - name: Handle command
        if: steps.parse.outputs.command != ''
        uses: actions/github-script@v7
        with:
          script: |
            const command = '${{ steps.parse.outputs.command }}';
            const issue_number = context.issue.number;
            
            switch(command) {
              case 'run-tests':
                // Trigger CI workflow
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'ci.yml',
                  ref: context.payload.issue.pull_request ? 
                    context.payload.pull_request.head.ref : 'master'
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue_number,
                  body: '✅ Tests triggered!'
                });
                break;
                
              case 'label':
                const label = '${{ steps.parse.outputs.label }}';
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue_number,
                  labels: [label]
                });
                break;
            }

  # Clean up stale issues and PRs
  stale-cleanup:
    name: Stale Cleanup
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions.'
          stale-pr-message: 'This PR has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions.'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          days-before-stale: 180
          days-before-close: 30
          exempt-issue-labels: 'pinned,security,bug'
          exempt-pr-labels: 'pinned,security'

  # Automatic conflict detection
  conflict-check:
    name: Conflict Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          if ! git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q "<<<<<<< "; then
            echo "No conflicts detected"
          else
            echo "::error::This PR has merge conflicts that must be resolved"
            exit 1
          fi